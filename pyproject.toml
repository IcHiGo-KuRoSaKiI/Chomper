[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chomper"
version = "1.0.0"
description = "Chomp through any document - MCP server for parsing 36+ file formats for AI systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ichigo" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "document-parsing",
    "pdf",
    "docx",
    "excel",
    "markdown",
    "html",
    "text-extraction",
    "ai-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.0.0",
    # Core parsing dependencies
    "pymupdf>=1.23.0",           # PDF extraction
    "python-docx>=1.1.0",        # DOCX extraction
    "python-pptx>=0.6.23",       # PPTX extraction
    "openpyxl>=3.1.2",           # Excel extraction
    "beautifulsoup4>=4.12.0",    # HTML extraction
    "trafilatura>=1.6.0",        # HTML article extraction
    "lxml>=5.0.0",               # XML/HTML parsing
    # Enrichment dependencies
    "nltk>=3.8.0",               # NLP for keyword extraction
    "scikit-learn>=1.3.0",       # TF-IDF keyword extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    # Type stubs
    "types-PyYAML>=6.0.0",
    "types-beautifulsoup4>=4.12.0",
    "lxml-stubs>=0.5.0",
]

minimal = [
    # Minimal dependencies for basic text/code/markdown parsing
    "mcp>=1.0.0",
]

[project.scripts]
chomper = "server:main"
chomper-parse = "cli:main"

[project.urls]
Homepage = "https://github.com/IcHiGo-KuRoSaKiI/Chomper"
Documentation = "https://github.com/IcHiGo-KuRoSaKiI/Chomper#readme"
Repository = "https://github.com/IcHiGo-KuRoSaKiI/Chomper"
Issues = "https://github.com/IcHiGo-KuRoSaKiI/Chomper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src", "server.py", "chomper.py", "cli.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/server.py",
    "/chomper.py",
    "/cli.py",
    "/pyproject.toml",
    "/README.md",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["E402"]  # Tests need sys.path setup before imports
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # Too noisy with dynamic libraries
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Only check project files
files = ["src", "server.py", "chomper.py", "cli.py"]
exclude = ["venv", "build", "dist", "tests"]

[[tool.mypy.overrides]]
module = ["src.extractors.*", "src.chunking.*", "src.formatters.*"]
disallow_untyped_defs = false  # Gradual typing for complex modules

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
