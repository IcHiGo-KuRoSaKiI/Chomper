[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-parser-mcp"
version = "1.0.0"
description = "MCP Server for multi-format document parsing with text, metadata, and image extraction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ichigo" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "document-parsing",
    "pdf",
    "docx",
    "excel",
    "markdown",
    "html",
    "text-extraction",
    "ai-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.0.0",
    # Core parsing dependencies
    "pymupdf>=1.23.0",           # PDF extraction
    "python-docx>=1.1.0",        # DOCX extraction
    "python-pptx>=0.6.23",       # PPTX extraction
    "openpyxl>=3.1.2",           # Excel extraction
    "beautifulsoup4>=4.12.0",    # HTML extraction
    "trafilatura>=1.6.0",        # HTML article extraction
    "lxml>=5.0.0",               # XML/HTML parsing
    # Enrichment dependencies
    "nltk>=3.8.0",               # NLP for keyword extraction
    "scikit-learn>=1.3.0",       # TF-IDF keyword extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

minimal = [
    # Minimal dependencies for basic text/code/markdown parsing
    "mcp>=1.0.0",
]

[project.scripts]
document-parser-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/IcHiGo-KuRoSaKiI/parser-mcp"
Documentation = "https://github.com/IcHiGo-KuRoSaKiI/parser-mcp#readme"
Repository = "https://github.com/IcHiGo-KuRoSaKiI/parser-mcp"
Issues = "https://github.com/IcHiGo-KuRoSaKiI/parser-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src", "server.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/server.py",
    "/pyproject.toml",
    "/README.md",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in default argument
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
